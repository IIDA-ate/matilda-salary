<script>
(function () {
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var test = /[?&]run\b/.test(location.search);
  document.getElementById('open').href = APP_URL;
  if (!(standalone || test)) return;
  // ホーム画面のアイコンから開いたときだけ、アプリをこの画面の中に全画面で表示する（移動しないのでSafariのバーが出ない）
  document.getElementById('install').classList.add('hide');
  var ld = document.getElementById('loading'), f = document.getElementById('app');
  ld.classList.remove('hide');
  f.src = APP_URL; f.classList.remove('hide');
  function hideLoading(){ ld.classList.add('hide'); }
  setTimeout(hideLoading, 20000);   // 万一アプリから合図が来なくても、20秒後には外す
  // アプリ（埋め込み側）との連絡：①起動の合図 ②「この端末のスタッフ」を覚えておく
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d.t || String(d.t).indexOf('matilda:') !== 0) return;
    if (d.t === 'matilda:ready') hideLoading();
    else if (d.t === 'matilda:get') { var v = ''; try { v = localStorage.getItem('matilda_staff') || ''; } catch (x) {} try { e.source.postMessage({ t: 'matilda:val', staff: v }, '*'); } catch (x) {} }
    else if (d.t === 'matilda:set' && /^[A-Za-z0-9_-]{1,20}$/.test(String(d.staff || ''))) { try { localStorage.setItem('matilda_staff', d.staff); } catch (x) {} }
    else if (d.t === 'matilda:clear') { try { localStorage.removeItem('matilda_staff'); } catch (x) {} }
  });
})();
</script>
