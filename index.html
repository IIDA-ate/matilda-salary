<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matilda salary</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matilda salary">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;box-sizing:border-box}
img{width:min(52vw,220px);height:auto;border-radius:22%;box-shadow:0 2px 14px rgba(0,0,0,.12)}
h1{font-size:20px;margin:0;font-weight:600}
p{margin:0;line-height:1.8;font-size:14px;color:#444;max-width:22em}
a.b{display:inline-block;margin-top:6px;padding:10px 18px;border:1px solid #111;border-radius:10px;color:#111;text-decoration:none;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<!--
  ▼ ここに、Apps Script の「ウェブアプリのURL」（https://script.google.com/macros/s/…/exec）を貼る（引用符の中だけ）
-->
<script>var APP_URL = 'https://script.google.com/macros/s/AKfycbx0nQK2qaR5mMmN_T2YtL4ZZPGptfDb3d6SZaWHjCD3LyggEdh2zVtUYSBx8f0XBeUj/exec';</script>

<div id="install">
  <img src="apple-touch-icon.png" alt="Matilda salary">
  <h1>Matilda salary</h1>
  <p>画面下の［共有］ボタン →［ホーム画面に追加］を押してください。<br>このアイコンから開くと、給与アプリが起動します。</p>
  <a class="b" id="open" href="#">アプリをこのまま開く</a>
</div>

<script>
(function () {
  var ok = /^https:\/\//.test(APP_URL);
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var force = /[?&]go\b/.test(location.search);
  if (ok) document.getElementById('open').href = APP_URL;
  else document.getElementById('open').classList.add('hide');
  // ホーム画面のアイコンから開いたときだけ、本物のアプリへ移動する
  if (ok && (standalone || force)) {
    document.getElementById('install').classList.add('hide');
    location.replace(APP_URL);
  }
})();
</script>
</body>
</html>
